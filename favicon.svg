<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Liam Lange">
  <!-- LL monogram. Stems are 8 units wide and the gap between them is 12
       units - 3px at 16px, the minimum that still reads as two letters in a
       tab. Feet stay short so the left foot cannot bridge the gap. -->
  <rect width="64" height="64" fill="#ded2c6" />
  <path d="M6 10 H14 V41 H20 V49 H6 Z" fill="#3b352f" />
  <path d="M31 10 H39 V41 H45 V49 H31 Z" fill="#3b352f" />
  <path d="M31 10 H39 V17 H31 Z" fill="#b04a41" />
</svg>
